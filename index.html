<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medata SingleMA｜單組統合分析工具</title>
    <script
      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>
    <script type="module" src="./hdh_start_20261115_CSX.js"></script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    
  
    <link rel="icon" type="image/png" href="./favicon_20261115_CSX.png" />
    <link rel="stylesheet" href="./theme_v3_20261115_CSX.css" />
    <link rel="stylesheet" href="./hdh_boot_20261115_CSX.css" />
  </head>
  <body>
    <div id="hdh-boot" class="hdh-loading">
      <div class="hdh-loading__box" role="status" aria-live="polite">
        <img class="hdh-logo-full" src="./brand_logo_main_trim_20261115_CSX.png" alt="匯東華標誌" />
        <p class="hdh-loading__name">Medata <b>SingleMA</b></p>
        <p class="hdh-brand__sub">單組統合分析工具　v1.0</p>
        <p class="hdh-tagline">智。數據決策</p>
        <p class="hdh-loading__msg">正在準備分析引擎…</p>
        <div class="hdh-progress" aria-hidden="true"><div class="hdh-progress__bar"></div></div>
        <p>第一次開啟需要下載 R 與統計套件（約 100 MB），請稍候。用手機行動網路時會用掉這些流量，建議改用 Wi-Fi。<br />這個過程只下載程式，不會傳送您的資料。</p>
        <p class="hdh-help">目前進度：<span id="hdh-boot-stage">正在下載 R</span></p>
        <div id="hdh-boot-err"></div>
      </div>
    </div>
    <script src="./hdh_boot_20261115_CSX.js"></script>
    
    <div style="height: 100vh; width: 100vw" id="root"></div>
    
  </body>
